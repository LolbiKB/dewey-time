name: Frontend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: dewey_time/frontend/hr_attendance

# Every job below installs the private @lolbikb/dewey-ui package from GitHub
# Packages before it can do anything. A failed install FAILS THE JOB.
#
# It used to be `continue-on-error: true` with every real step gated on
# `steps.install.outcome == 'success'`, so a failed install skipped the work and
# reported success. Because all five jobs pull the same package with the same
# token, the realistic trigger — a revoked grant, an expired PAT, a registry
# outage — took out all five at once and the PR showed all-green having run
# nothing. See #138.
#
# `npm install` (not `npm ci`): the committed lockfile may omit platform-gated
# optional deps that Linux needs.

jobs:
  # Types are a real gate here, not advisory. `tsconfig.json` covers src/, e2e/,
  # devPort.ts and playwright.config.ts, so this also catches the drift class
  # that `test:web` structurally cannot: its globs are non-recursive and skip
  # `.tsx` under src/lib, so a file can be un-run by the suite and still be
  # type-checked here.
  typecheck:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read # read @lolbikb/dewey-ui from GitHub Packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - id: install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install --no-audit --no-fund
      # Diagnosis only — the job is already failing by the time this runs.
      # Scoped to `steps.install`, so a plain test failure does not get blamed
      # on package access.
      - if: ${{ failure() && steps.install.outcome == 'failure' }}
        run: echo "::error title=Typecheck could not run::npm install failed — grant this repo read access to the @lolbikb/dewey-ui GitHub Package (or add a read:packages PAT)"
      - run: npm run typecheck
      # The build is a gate too, and not only because a broken one blocks the
      # deploy: `npm run build` ends in scripts/check-fonts.mjs, which asserts
      # that every webfont the stylesheet references was actually emitted and
      # rewritten. That defect shipped once and nothing caught it — the build
      # succeeded, tsc passed, every test passed, and the fonts 503'd in
      # production behind a font-display:swap fallback. Only running the build
      # can catch it.
      - run: npm run build

  unit-web:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read # read @lolbikb/dewey-ui from GitHub Packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - id: install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install --no-audit --no-fund
      - if: ${{ failure() && steps.install.outcome == 'failure' }}
        run: echo "::error title=Frontend unit tests could not run::npm install failed — grant this repo read access to the @lolbikb/dewey-ui GitHub Package (or add a read:packages PAT)"
      - run: npm run test:web

  e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - id: install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install --no-audit --no-fund
      - if: ${{ failure() && steps.install.outcome == 'failure' }}
        run: echo "::error title=E2E could not run::npm install failed — grant this repo read access to the @lolbikb/dewey-ui GitHub Package (or add a read:packages PAT)"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Still scoped to a successful install: a failed install produces no
      # report, and uploading a missing path would only add noise to the failure.
      - if: ${{ failure() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dewey_time/frontend/hr_attendance/playwright-report/
          retention-days: 7

  adms-unit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dewey_time/frontend/adms
    permissions:
      contents: read
      packages: read # read @lolbikb/dewey-ui from GitHub Packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - id: install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install --no-audit --no-fund
      - if: ${{ failure() && steps.install.outcome == 'failure' }}
        run: echo "::error title=ADMS unit tests could not run::npm install failed — grant this repo read access to the @lolbikb/dewey-ui GitHub Package (or add a read:packages PAT)"
      - run: npm run build
      - run: npm test

  adms-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dewey_time/frontend/adms
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - id: install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install --no-audit --no-fund
      - if: ${{ failure() && steps.install.outcome == 'failure' }}
        run: echo "::error title=ADMS E2E could not run::npm install failed — grant this repo read access to the @lolbikb/dewey-ui GitHub Package (or add a read:packages PAT)"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: ${{ failure() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: adms-playwright-report
          path: dewey_time/frontend/adms/playwright-report/
          retention-days: 7

  # THE #1 RECURRING FAILURE IN THIS REPO, given a gate.
  #
  # Frappe Cloud never builds these SPAs — it cannot, because they depend on the
  # private @lolbikb/dewey-ui package and a fresh `npm install` returns 401
  # without a token. Whatever bundle is committed IS what users get, so a merged
  # PR that changes frontend source without committing the rebuilt bundle ships
  # nothing at all. It has happened: assets went un-rebuilt from #58 through #74,
  # four PRs of frontend work, none of it live.
  #
  # This compares the PR's own diff rather than rebuilding and diffing the
  # output. Rebuilding cannot work as a gate here: `build-id.txt` is stamped
  # from the clock and several dependencies are pinned to "latest", so CI's
  # bundle legitimately differs from the committed one whenever any transitive
  # package publishes — a gate that cries wolf gets switched off. Asking "was
  # the source touched without the bundle" has no such failure mode.
  #
  # It cannot catch a bundle rebuilt from stale source; nothing cheap can. It
  # catches the one that actually keeps happening.
  bundle-freshness:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: .
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: A frontend change must ship its rebuilt bundle
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE" "$HEAD")

          # Source that ends up inside a bundle. Tests and e2e specs are
          # excluded: they never reach the shipped artifact.
          source_touched=$(printf '%s\n' "$changed" \
            | grep -E '^dewey_time/frontend/hr_attendance/(src/|index\.html|index\.miniapp\.html|vite\.config\.ts|vite\.miniapp\.config\.ts|tailwind\.config\.js|scripts/)' \
            | grep -vE '\.test\.tsx?$' || true)

          if [ -z "$source_touched" ]; then
            echo "No shipped frontend source changed — nothing to rebuild."
            exit 0
          fi

          echo "Frontend source changed:"
          printf '  %s\n' $source_touched

          # `npm run build` rebuilds BOTH bundles, so a genuine rebuild always
          # shows up in both. Requiring both is what stops "I rebuilt the HR app
          # and forgot the Mini App".
          missing=""
          for bundle in dewey_time/public/hr_attendance dewey_time/public/miniapp; do
            if ! printf '%s\n' "$changed" | grep -q "^$bundle/"; then
              missing="$missing $bundle"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error title=Bundle not rebuilt::Frontend source changed but these committed bundles did not:$missing — run 'npm run build' in dewey_time/frontend/hr_attendance and commit the result. Frappe Cloud will not build it for you, so merging this ships nothing."
            exit 1
          fi

          echo "Both bundles were rebuilt and committed."
