name: Frontend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: dewey_time/frontend/hr_attendance

# Every job below installs the private @lolbikb/dewey-ui package from GitHub
# Packages before it can do anything. A failed install FAILS THE JOB.
#
# It used to be `continue-on-error: true` with every real step gated on
# `steps.install.outcome == 'success'`, so a failed install skipped the work and
# reported success. Because all five jobs pull the same package with the same
# token, the realistic trigger — a revoked grant, an expired PAT, a registry
# outage — took out all five at once and the PR showed all-green having run
# nothing. See #138.
#
# `npm install` (not `npm ci`): the committed lockfile may omit platform-gated
# optional deps that Linux needs.

jobs:
  # Types are a real gate here, not advisory. `tsconfig.json` covers src/, e2e/,
  # devPort.ts and playwright.config.ts, so this also catches the drift class
  # that `test:web` structurally cannot: its globs are non-recursive and skip
  # `.tsx` under src/lib, so a file can be un-run by the suite and still be
  # type-checked here.
  typecheck:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read # read @lolbikb/dewey-ui from GitHub Packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - id: install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install --no-audit --no-fund
      # Diagnosis only — the job is already failing by the time this runs.
      # Scoped to `steps.install`, so a plain test failure does not get blamed
      # on package access.
      - if: ${{ failure() && steps.install.outcome == 'failure' }}
        run: echo "::error title=Typecheck could not run::npm install failed — grant this repo read access to the @lolbikb/dewey-ui GitHub Package (or add a read:packages PAT)"
      - run: npm run typecheck

  unit-web:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read # read @lolbikb/dewey-ui from GitHub Packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - id: install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install --no-audit --no-fund
      - if: ${{ failure() && steps.install.outcome == 'failure' }}
        run: echo "::error title=Frontend unit tests could not run::npm install failed — grant this repo read access to the @lolbikb/dewey-ui GitHub Package (or add a read:packages PAT)"
      - run: npm run test:web

  e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - id: install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install --no-audit --no-fund
      - if: ${{ failure() && steps.install.outcome == 'failure' }}
        run: echo "::error title=E2E could not run::npm install failed — grant this repo read access to the @lolbikb/dewey-ui GitHub Package (or add a read:packages PAT)"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Still scoped to a successful install: a failed install produces no
      # report, and uploading a missing path would only add noise to the failure.
      - if: ${{ failure() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dewey_time/frontend/hr_attendance/playwright-report/
          retention-days: 7

  adms-unit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dewey_time/frontend/adms
    permissions:
      contents: read
      packages: read # read @lolbikb/dewey-ui from GitHub Packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - id: install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install --no-audit --no-fund
      - if: ${{ failure() && steps.install.outcome == 'failure' }}
        run: echo "::error title=ADMS unit tests could not run::npm install failed — grant this repo read access to the @lolbikb/dewey-ui GitHub Package (or add a read:packages PAT)"
      - run: npm run build
      - run: npm test

  adms-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dewey_time/frontend/adms
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - id: install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install --no-audit --no-fund
      - if: ${{ failure() && steps.install.outcome == 'failure' }}
        run: echo "::error title=ADMS E2E could not run::npm install failed — grant this repo read access to the @lolbikb/dewey-ui GitHub Package (or add a read:packages PAT)"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: ${{ failure() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: adms-playwright-report
          path: dewey_time/frontend/adms/playwright-report/
          retention-days: 7
