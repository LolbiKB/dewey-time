name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
      redis-cache:
        image: redis:6.2-alpine
        ports: ["13000:6379"]
      redis-queue:
        image: redis:6.2-alpine
        ports: ["11000:6379"]

    env:
      # Must match the Frappe Cloud site's major version (prod runs v16 —
      # frappe/erpnext 16.x, hrms 16.x). Bump here whenever prod moves tracks;
      # testing against a different major makes engine behaviour untrustworthy.
      FRAPPE_BRANCH: version-16
      ERPNEXT_BRANCH: version-16
      HRMS_BRANCH: version-16
      DB_ROOT_PASSWORD: root

    steps:
      - name: Checkout dewey_time
        uses: actions/checkout@v4
        with:
          path: dewey_time-src

      - uses: actions/setup-python@v5
        with:
          # frappe 16.23 (prod's version) pins Python >=3.14,<3.15 in its pyproject —
          # the bench env must be 3.14, or `uv pip install -e frappe` won't resolve.
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          # frappe v16 requires Node >=24 (bench init runs `yarn install`, whose
          # engine check rejects older Node). Keep in step with FRAPPE_BRANCH.
          node-version: "24"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mariadb-client

      - name: Install frappe-bench
        run: pip install frappe-bench

      - name: Init bench + fetch apps (frappe → erpnext → hrms → dewey_time)
        run: |
          bench init --skip-redis-config-generation --skip-assets \
            --frappe-branch "$FRAPPE_BRANCH" --python "$(which python)" frappe-bench
          cd frappe-bench
          # --skip-assets: dewey_time ships pre-built committed assets (Frappe
          # Cloud never builds them), and backend tests need no frontend build.
          bench get-app erpnext --branch "$ERPNEXT_BRANCH" --skip-assets
          bench get-app hrms --branch "$HRMS_BRANCH" --skip-assets
          bench get-app dewey_time "$GITHUB_WORKSPACE/dewey_time-src" --skip-assets
          # Canonical layout auto-registers in apps.txt; this is a harmless
          # belt-and-suspenders that also guarantees it's listed before install.
          # Force a trailing newline first — apps.txt may lack one, else the
          # append concatenates onto the last app (-> 'hrmsdewey_time').
          [ -s sites/apps.txt ] && [ -n "$(tail -c1 sites/apps.txt)" ] && echo >> sites/apps.txt
          grep -qxF dewey_time sites/apps.txt 2>/dev/null || echo dewey_time >> sites/apps.txt

      - name: MariaDB charset (utf8mb4)
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -p"$DB_ROOT_PASSWORD" \
            -e "SET GLOBAL character_set_server='utf8mb4'; SET GLOBAL collation_server='utf8mb4_unicode_ci';"

      - name: Create site + install apps
        working-directory: frappe-bench
        run: |
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache "redis://127.0.0.1:13000"
          bench set-config -g redis_queue "redis://127.0.0.1:11000"
          bench set-config -g redis_socketio "redis://127.0.0.1:11000"
          bench new-site test_site \
            --no-mariadb-socket \
            --db-host 127.0.0.1 \
            --mariadb-root-password "$DB_ROOT_PASSWORD" \
            --admin-password admin
          bench --site test_site install-app erpnext hrms dewey_time
          bench --site test_site set-config allow_tests true

      - name: Run dewey_time tests
        working-directory: frappe-bench
        run: bench --site test_site run-tests --app dewey_time

      # The step above runs the WHOLE app, and under that form
      # test_integration_pilot_matrix self-skips: the other test modules inject a
      # MagicMock as `frappe` at import time, the module detects it is not on a
      # real bench, and skips rather than erroring. So everything it proves --
      # DocType fields actually migrating, a Select round-tripping, the flag
      # engine's behaviour against real Frappe -- was verified by hand once and
      # then guarded by nothing (punch list T3-12).
      #
      # Running it alone, by module, is the only form that executes it. That only
      # became possible in #149: the module used to inherit FrappeTestCase, whose
      # preparation walks the app and imports every test_*.py, re-creating the
      # same MagicMock pollution from inside the isolated run. It inherits
      # IntegrationTestCase now.
      - name: Bootstrap the site for real-DB tests
        working-directory: frappe-bench
        # `bench new-site` + `install-app` never runs ERPNext's setup wizard, so
        # the site has no Company -- and TestPilotMatrix.setUpClass opens with
        # `frappe.db.get_value("Company", {}, "name")` and links every fixture
        # Employee to the result. Fiscal Years matter too: HRMS's before_tests
        # calls get_fiscal_year(nowdate()) and aborts the whole runner without
        # them. This is the same idempotent entrypoint the frappe-sandbox harness
        # calls via its bootstrap_method hook.
        #
        # Deliberately AFTER the full-app run above, not before: a Company
        # appearing mid-suite could change what those tests exercise, and this
        # step should add a gate, not quietly alter an existing one.
        run: bench --site test_site execute dewey_time.utils.sandbox_bootstrap.run

      - name: Run real-bench integration tests
        working-directory: frappe-bench
        # No continue-on-error. A gate that cannot fail the build is not a gate,
        # and this repo has already been burned by exactly that: the Frontend
        # job's `npm install` was continue-on-error, so a failed install left the
        # job green with zero tests run.
        run: |
          set -o pipefail
          bench --site test_site run-tests \
            --module dewey_time.tests.test_integration_pilot_matrix 2>&1 | tee bench-module.log

          # A genuine test failure never reaches the checks below: pipefail plus
          # the runner's default `bash -e` aborts on bench's exit code. What
          # follows is only for the cases that exit 0 while proving nothing --
          # both of which render as a green check:
          #
          #   Ran 0 tests   ... OK                 -> nothing was collected
          #   Ran 17 tests  ... OK (skipped=17)    -> the module self-skipped
          #
          # Note the second one still prints a plausible test count, so counting
          # is not enough; what distinguishes a real run is that fewer tests
          # skipped than ran.
          # awk, not sed: awk's ERE is the same on the GNU sed CI runs and the BSD
          # sed a macOS developer runs, so this block can be exercised by hand
          # before it is trusted. A guard against hollow greens that is itself
          # only testable in CI would be the same mistake one level up.
          ran=$(awk '/^Ran [0-9]+ test/ {print $2}' bench-module.log | tail -1)
          skipped=$(awk -F'skipped=' '/OK \(skipped=/ {split($2, a, ")"); print a[1]}' bench-module.log | tail -1)
          : "${ran:=0}" "${skipped:=0}"

          if [ "$ran" -eq 0 ]; then
            echo "::error::the integration module collected no tests — it was not found, or it errored before running"
            exit 1
          fi
          if [ "$skipped" -ge "$ran" ]; then
            echo "::error::all $ran tests skipped — the module did not detect a real bench (_HAS_REAL_BENCH false)"
            exit 1
          fi
          echo "integration module executed for real: $ran ran, $skipped skipped"
