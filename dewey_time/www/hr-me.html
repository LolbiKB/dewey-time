<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/assets/dewey_time/images/dewey-time.svg" />
    <title>My Attendance</title>
    <!-- Telegram's SDK, which is what puts initData on window.Telegram.WebApp.
         It has to be a plain script tag from telegram.org: Telegram does not
         inject it, and vendoring a copy is unsupported.

         `defer` is load-bearing, not tidiness. Without it this is a blocking
         classic script in <head>, so the parser stops here until it resolves —
         measured, a request that never completes leaves <body> unparsed and
         the app renders NOTHING, with no error to explain it. That is a
         third-party CDN on the critical path to first paint, over whatever
         connection a phone on a factory floor happens to have.

         Ordering still holds: deferred classic scripts and module scripts both
         run after parsing, in document order, so the SDK is on `window` before
         main.tsx reads it. -->
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" crossorigin src="/assets/dewey_time/miniapp/assets/index.js?v=1786933000514"></script>
    <link rel="stylesheet" crossorigin href="/assets/dewey_time/miniapp/assets/index.css?v=1786933000514">
      <script>window.csrf_token = "{{ frappe.session.csrf_token }}";</script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
