<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/assets/dewey_time/images/dewey-time.svg" />
    <title>My Attendance</title>
    <!-- Telegram's SDK, which is what puts initData on window.Telegram.WebApp.
         It has to be a plain script tag from telegram.org: Telegram does not
         inject it, and vendoring a copy is unsupported.

         `defer` is load-bearing, not tidiness. Without it this is a blocking
         classic script in <head>, so the parser stops here until it resolves —
         measured, a request that never completes leaves <body> unparsed and
         the app renders NOTHING, with no error to explain it. That is a
         third-party CDN on the critical path to first paint, over whatever
         connection a phone on a factory floor happens to have.

         Ordering still holds: deferred classic scripts and module scripts both
         run after parsing, in document order, so the SDK is on `window` before
         main.tsx reads it. -->
    <!--
         `?63` is the SDK's own version stamp, and it is the cache key. Without
         it a phone that loaded this app once keeps whatever copy of
         telegram-web-app.js it cached then — and an older copy simply does not
         define the newer surface. `safeAreaInset`, `contentSafeAreaInset` and
         the `activated` event are all Bot API 8.0; on a stale SDK they are
         `undefined`, every guard in telegramChrome.ts reads that as "old
         client", and the app quietly renders with zero insets on a phone whose
         Telegram is perfectly current. Telegram's own docs ship the number in
         the snippet for exactly this reason. Bump it when they do.
    -->
    <script defer src="https://telegram.org/js/telegram-web-app.js?63"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/miniapp/main.tsx"></script>
  </body>
</html>
