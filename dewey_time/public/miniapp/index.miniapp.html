<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/assets/dewey_time/images/dewey-time.svg" />
    <title>My Attendance</title>
    <!-- NO TELEGRAM SDK TAG HERE, and its absence is load-bearing.

         It was `<script defer src="https://telegram.org/js/telegram-web-app.js?63">`,
         and the comment that lived here argued `defer` had solved the
         third-party-CDN-on-the-critical-path problem. It solved half of it.
         `defer` unblocks the PARSER — <body> is parsed, #root exists — but a
         deferred classic script and a module script share ONE "execute when
         parsing has finished" list, in document order. So while the request
         for telegram.org hung, main.tsx was fetched and never executed: no
         React, no error boundary, no notice, nothing to press, for as long as
         the socket stayed open. Measured against the deployed bundle.

         A request that FAILS was always fine — it settles and the list moves
         on. Only a hang produced nothing at all, and a hang is what a captive
         portal or a dying cell does.

         src/miniapp/telegramSdk.ts loads it instead, with a timeout, so the
         app can say what happened. See that file for the ?63 cache key, which
         moved there with it. -->
    <link rel="preconnect" href="https://telegram.org" />
    <script type="module" crossorigin src="/assets/dewey_time/miniapp/assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/dewey_time/miniapp/assets/index.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
